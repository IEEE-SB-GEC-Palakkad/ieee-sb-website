name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: npm run build
        env:
          # ─────────────────────────────────────────────────────────────────
          # VITE_BASE controls the Vite `base` path.
          #
          # ▸ If you have a custom domain (e.g. ieee-sb.gecpkd.ac.in):
          #     Leave VITE_BASE unset or set to /
          #
          # ▸ If deploying to the default GitHub Pages sub-path URL
          #     (https://<org>.github.io/ieee-sb-website/):
          #     Uncomment the line below:
          #
          # VITE_BASE: /ieee-sb-website/
          # ─────────────────────────────────────────────────────────────────
          VITE_BASE: /ieee-sb-website/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
