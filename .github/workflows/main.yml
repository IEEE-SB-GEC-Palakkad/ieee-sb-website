name: Sync to IEEE-SB-GECPKD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-to-gecpkd-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'IEEE-SB-GEC-Palakkad/ieee-sb-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: AutoPush

    steps:
      - name: Checkout source main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync main and create an empty Vercel deployment commit
        env:
          GH_IEEE_PAT: ${{ secrets.GH_IEEE_PAT }}
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-to-gecpkd.sh
